name: Hareketsiz Issue ve PR Kontrolü

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: stale
  cancel-in-progress: false

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/stale@v10
        with:
          days-before-stale: 14
          days-before-close: 7
          stale-issue-label: hareketsiz
          stale-pr-label: hareketsiz
          stale-issue-message: >
            Bu konu uzun süredir hareketsiz kaldığı için otomatik olarak "hareketsiz" olarak işaretlendi. 7 gün içinde yeni bir yorum gelmezse kapatılacaktır.
          stale-pr-message: >
            Bu PR uzun süredir hareketsiz kaldığı için otomatik olarak "hareketsiz" olarak işaretlendi. 7 gün içinde yeni bir yorum gelmezse kapatılacaktır.
          close-issue-message: >
            Belirtilen sürede herhangi bir işlem yapılmadığı için bu konu otomatik olarak kapatıldı. Sorun devam ediyorsa yeni bir konu açabilirsiniz.
          close-pr-message: >
            Belirtilen sürede herhangi bir işlem yapılmadığı için bu PR otomatik olarak kapatıldı. Çalışma devam ediyorsa yeniden açabilirsiniz.
